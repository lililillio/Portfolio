<!DOCTYPE html>
<html lang="ko">
<head>

<meta property="og:type" content="website">
<meta property="og:title" content="김마케 | 콘텐츠 마케터 포트폴리오">
<meta property="og:description" content="숫자로 증명하는 콘텐츠 마케터 김마케의 포트폴리오입니다.">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style id="design-zone">
/* =========================================================
   ① 디자인 구역 — AI에게 이 <style> 안의 내용만 복사해서 주세요
   색, 폰트, 버튼, 카드, 헤더 모양을 바꿀 수 있습니다.
   ※ 변수 이름(--bg 같은 것)과 선택자 이름은 그대로 두고 값만 바꾸세요.
   ========================================================= */
:root {
  --font-body: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-heading: var(--font-body);
  --heading-weight: 800;
  --max-width: 1080px;
}

/* 테마 1: 클린 화이트 */
[data-theme="clean"] {
  --bg: #ffffff; --surface: #f5f7fa; --text: #141922; --muted: #5a6372; --border: #e3e7ee;
  --primary: #2557e8; --primary-ink: #ffffff; --accent: #e8efff; --radius: 14px;
  --header-bg: rgba(255,255,255,.92); --header-ink: #141922;
  --hero-bg: linear-gradient(135deg, #eef3ff 0%, #ffffff 65%); --hero-ink: #141922;
  --hero-btn-bg: #2557e8; --hero-btn-ink: #ffffff;
}
/* 테마 2: 네이비 프로 */
[data-theme="navy"] {
  --bg: #ffffff; --surface: #f3f5f9; --text: #0f1a2e; --muted: #56627a; --border: #dfe4ec;
  --primary: #13284f; --primary-ink: #ffffff; --accent: #e6ebf5; --radius: 6px;
  --header-bg: #13284f; --header-ink: #ffffff;
  --hero-bg: linear-gradient(135deg, #13284f 0%, #24427a 100%); --hero-ink: #ffffff;
  --hero-btn-bg: #ffffff; --hero-btn-ink: #13284f;
}
/* 테마 3: 웜 베이지 */
[data-theme="beige"] {
  --bg: #faf6f0; --surface: #f2ebe0; --text: #2e2620; --muted: #74685c; --border: #e6dccd;
  --primary: #b0643c; --primary-ink: #ffffff; --accent: #f3e3d3; --radius: 22px;
  --header-bg: rgba(250,246,240,.92); --header-ink: #2e2620;
  --hero-bg: linear-gradient(160deg, #f3e3d3 0%, #faf6f0 70%); --hero-ink: #2e2620;
  --hero-btn-bg: #b0643c; --hero-btn-ink: #ffffff;
}
/* 테마 4: 다크 모던 */
[data-theme="dark"] {
  --bg: #0e1014; --surface: #171a21; --text: #eef1f6; --muted: #9aa3b2; --border: #2a303b;
  --primary: #7cf0c5; --primary-ink: #0b0d10; --accent: #1c2c28; --radius: 12px;
  --header-bg: rgba(14,16,20,.9); --header-ink: #eef1f6;
  --hero-bg: radial-gradient(circle at 20% 20%, #1d3a33 0%, #0e1014 60%); --hero-ink: #eef1f6;
  --hero-btn-bg: #7cf0c5; --hero-btn-ink: #0b0d10;
}
/* 테마 5: 비비드 포인트 */
[data-theme="vivid"] {
  --bg: #ffffff; --surface: #fff6f3; --text: #16121a; --muted: #5e5866; --border: #f0e2dc;
  --primary: #e8411f; --primary-ink: #ffffff; --accent: #fff0b8; --radius: 18px;
  --header-bg: rgba(255,255,255,.92); --header-ink: #16121a;
  --hero-bg: linear-gradient(120deg, #fff0b8 0%, #ffe1d9 55%, #ffffff 100%); --hero-ink: #16121a;
  --hero-btn-bg: #e8411f; --hero-btn-ink: #ffffff;
}

body { background: var(--bg); color: var(--text); font-family: var(--font-body); }
h1, h2, h3 { font-family: var(--font-heading); font-weight: var(--heading-weight); letter-spacing: -0.02em; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 12px 22px; border-radius: 999px;
  font-weight: 700; font-size: 15px; background: var(--primary); color: var(--primary-ink);
  border: 2px solid var(--primary); text-decoration: none; cursor: pointer; font-family: inherit; }
.btn.ghost { background: transparent; color: inherit; border-color: currentColor; }
.hero .btn { background: var(--hero-btn-bg); color: var(--hero-btn-ink); border-color: var(--hero-btn-bg); }
.hero .btn.ghost { background: transparent; color: var(--hero-ink); border-color: var(--hero-ink); }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }

/* 헤더와 첫 화면 */
.site-header { background: var(--header-bg); color: var(--header-ink); }
.hero { background: var(--hero-bg); color: var(--hero-ink); }

/* 키워드 칩, 성과 숫자 */
.chip { background: var(--accent); color: var(--text); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; }
.stat-value { color: var(--primary); }
/* ========== ① 디자인 구역 끝 ========== */
</style>

<style id="engine-style">
/* =========================================================
   ③ 엔진 구역(스타일) — 수정 금지
   이 아래를 고치면 화면 배치나 편집 기능이 깨질 수 있습니다.
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:var(--max-width);margin:0 auto;padding:0 24px}
.blk{padding:72px 0}
.blk+.blk{padding-top:24px}
.sec-title{font-size:28px;margin-bottom:24px;line-height:1.3}
.muted{color:var(--muted)}

/* 헤더 · 메뉴 */
.site-header{position:sticky;top:0;z-index:50;backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid color-mix(in srgb,var(--header-ink) 10%,transparent)}
body.ed-on .site-header{top:52px}
.head-row{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.brand{font-weight:800;font-size:19px;text-decoration:none;letter-spacing:-0.02em;white-space:nowrap}
.nav-toggle{display:none;background:none;border:0;font-size:24px;color:inherit;cursor:pointer;padding:6px 10px}
.nav ul{list-style:none;margin:0;padding:0}
.nav-l1{display:flex;gap:2px}
.nav-li{position:relative}
.nav-row{display:flex;align-items:center}
.nav-a{display:block;padding:10px 14px;text-decoration:none;font-weight:600;font-size:15px;border-radius:10px;white-space:nowrap}
.nav-a:hover,.nav-a.active{background:color-mix(in srgb,currentColor 9%,transparent)}
.sub-toggle{display:none;background:none;border:0;color:inherit;cursor:pointer;font-size:14px;padding:10px 14px}
.nav-sub{display:none;position:absolute;top:100%;left:0;min-width:210px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);padding:6px;z-index:5}
.nav-sub .nav-a{font-weight:500;font-size:14px}
.nav-li:hover>.nav-sub,.nav-li:focus-within>.nav-sub{display:block}
.nav-sub.d3{top:-7px;left:100%}
.nav-l1>.nav-li:nth-last-child(-n+2)>.nav-sub{left:auto;right:0}
.nav-l1>.nav-li:nth-last-child(-n+2) .nav-sub.d3{left:auto;right:100%}
.nav-sub .has-sub>.nav-row>.nav-a::after{content:"›";margin-left:8px;opacity:.6}
.narrow .nav-toggle{display:block}
.narrow .nav{display:none;position:absolute;left:0;right:0;top:64px;background:var(--bg);color:var(--text);border-bottom:1px solid var(--border);padding:8px 16px 16px;max-height:calc(100vh - 64px);overflow:auto;box-shadow:0 16px 24px rgba(0,0,0,.08)}
.narrow .nav.open{display:block}
.narrow .nav-l1{flex-direction:column}
.narrow .nav-row{justify-content:space-between}
.narrow .nav-a{flex:1}
.narrow .sub-toggle{display:block}
.narrow .nav-sub,.narrow .nav-sub.d3{position:static;display:none;box-shadow:none;border:0;border-left:2px solid var(--border);border-radius:0;margin-left:14px;padding:0 0 0 6px;min-width:0}
.narrow .nav-li.open>.nav-sub{display:block}
.narrow .nav-li:hover>.nav-sub{display:none}
.narrow .nav-li.open:hover>.nav-sub{display:block}
.narrow .nav-sub .has-sub>.nav-row>.nav-a::after{content:none}

/* 페이지 머리말 */
.page-head{padding:56px 0 8px}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 8px;opacity:.5}
.page-title{font-size:40px;line-height:1.25}
.narrow .page-title{font-size:30px}

/* 이미지 자리 */
.img-slot{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--surface);aspect-ratio:4/3}
.img-slot img{width:100%;height:100%;object-fit:cover}
.img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,var(--surface)),var(--surface));color:var(--muted);font-size:14px;font-weight:600;text-align:center;padding:12px}

/* 히어로 */
.hero{padding:88px 0}
.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center}
.hero-name{font-weight:700;font-size:17px;opacity:.85;margin-bottom:12px}
.hero-headline{font-size:46px;line-height:1.2;margin-bottom:18px}
.hero-sub{font-size:18px;opacity:.85;margin-bottom:28px;white-space:pre-line}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}
.hero-img{aspect-ratio:4/5}
.narrow .hero{padding:48px 0}
.narrow .hero-grid{grid-template-columns:1fr;gap:32px}
.narrow .hero-headline{font-size:32px}
.narrow .hero-img{aspect-ratio:4/3}

/* 자기소개 */
.about-grid{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:start}
.about-img{aspect-ratio:1/1}
.about-text{font-size:17px;white-space:pre-line;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.narrow .about-grid{grid-template-columns:1fr;gap:28px}
.narrow .about-img{max-width:260px}

/* 성과 숫자 */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.stat{padding:26px 24px}
.stat-num{display:flex;align-items:baseline;gap:4px;margin-bottom:6px}
.stat-value{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-0.03em}
.stat-unit{font-size:20px;font-weight:700}
.stat-label{color:var(--muted);font-size:15px}

/* 프로젝트 카드 */
.pcard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:inherit;height:100%;transition:transform .15s ease,box-shadow .15s ease}
a.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.1)}
.pcard .img-slot{border-radius:0;aspect-ratio:16/10}
.pcard-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard-body .chip{align-self:flex-start;font-size:12px;padding:4px 10px}
.pcard-title{font-size:20px;line-height:1.35}
.pcard-sum{color:var(--muted);font-size:15px;white-space:pre-line}
.pcard-more{margin-top:auto;padding-top:8px;font-weight:700;font-size:14px;color:var(--primary)}

/* STAR */
.star-meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-bottom:22px;font-size:15px}
.meta-k{color:var(--muted);margin-right:8px}
.meta-v{font-weight:600}
.star-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.star-cell{padding:24px}
.star-cell.r{border:2px solid var(--primary)}
.star-label{font-size:14px;color:var(--muted);margin-bottom:8px}
.star-label b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-size:13px;margin-right:6px}
.star-text{white-space:pre-line;font-size:16px}
.narrow .star-grid{grid-template-columns:1fr}

/* 이미지+텍스트 */
.it-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.it-grid.flip>.img-slot{order:2}
.it-title{font-size:26px;line-height:1.3;margin-bottom:14px}
.it-text-body{white-space:pre-line;font-size:16px;color:var(--muted)}
.narrow .it-grid{grid-template-columns:1fr;gap:24px}
.narrow .it-grid.flip>.img-slot{order:0}

/* 갤러리 */
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.gitem{margin:0}
.gitem figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.gallery .img-slot img{cursor:zoom-in}
body.ed-on .gallery .img-slot img{cursor:pointer}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:200;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* 타임라인 */
.tl{position:relative;padding-left:28px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:26px;margin-left:6px}
.tl-item{position:relative}
.tl-dot{position:absolute;left:-36px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--primary);border:3px solid var(--bg)}
.tl-date{font-size:14px;color:var(--primary);font-weight:700}
.tl-title{font-size:19px;margin:2px 0 4px}
.tl-desc{color:var(--muted);white-space:pre-line}

/* 연락처 */
.contact-box{padding:48px;text-align:center}
.contact-text{color:var(--muted);margin:10px auto 22px;max-width:560px;white-space:pre-line}
.contact-email{display:inline-block;font-size:22px;font-weight:700;margin-bottom:24px;text-decoration:none;color:var(--primary)}
.contact-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
.narrow .contact-box{padding:32px 20px}

/* 바닥글 */
.site-footer{padding:40px 0 48px;color:var(--muted);font-size:14px;border-top:1px solid var(--border);margin-top:48px}

/* 인쇄(PDF) */
.print-bar{position:sticky;top:0;z-index:60;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#1f2430;color:#fff;font-size:15px;font-family:var(--font-body)}
.print-bar .btn{padding:8px 16px;font-size:14px}
.print-bar .btn.ghost{color:#fff}
.print-page{padding-bottom:24px}
@media print{
  .print-bar,.no-print,#ed-bar,#ed-panel,.ed-toast{display:none!important}
  body{padding:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-page+.print-page{break-before:page}
  .card,.tl-item,.gitem,.stat,.star-cell,.it-grid,.about-grid,.hero-grid{break-inside:avoid}
  .sec-title,.page-head{break-after:avoid}
  .blk{padding:28px 0}
  .hero{padding:40px 0}
  a.pcard:hover{transform:none;box-shadow:none}
}

/* ---------- 편집 모드 UI ---------- */
body.ed-on{padding-top:52px}
#ed-bar{position:fixed;top:0;left:0;right:0;height:52px;z-index:100;background:#1f2430;color:#fff;font:14px/1.2 'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.ed-bar-in{height:100%;display:flex;align-items:center;gap:6px;padding:0 12px;overflow-x:auto;white-space:nowrap}
.ed-logo{margin-right:8px;color:#9fe3c9}
#ed-bar button{font:inherit;background:#323848;color:#fff;border:0;border-radius:8px;padding:8px 11px;cursor:pointer}
#ed-bar button:hover{background:#41495d}
#ed-bar button.on{background:#4b6cff}
#ed-bar .ed-primary{background:#2fb67c;font-weight:700}
#ed-bar .ed-primary:hover{background:#26a06c}
.ed-status{margin-left:auto;margin-right:6px;font-size:13px;color:#b8bfcc}
.ed-status.dirty{color:#ffd166}
.ed-sp{flex:0 0 8px}
.editing .ed-block{position:relative;outline:1px dashed transparent;outline-offset:-1px;transition:outline-color .15s}
.editing .ed-block:hover{outline-color:#8aa2ff}
.ed-btools{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:4px;align-items:center;background:#1f2430;color:#fff;border-radius:10px;padding:4px;opacity:.25;transition:opacity .15s;font:13px/1 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif}
.ed-block:hover>.ed-btools,.ed-block:focus-within>.ed-btools{opacity:1}
.ed-btools button,.ed-itools button{font:inherit;background:#323848;color:#fff;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;line-height:1}
.ed-btools button:hover,.ed-itools button:hover{background:#4b6cff}
.ed-btools .ed-del:hover,.ed-itools .ed-del:hover{background:#e5484d}
.ed-bname{padding:0 6px;color:#9fe3c9;font-weight:700}
.ed-chk{display:flex;align-items:center;gap:4px;padding:0 6px;cursor:pointer}
.ed-handle{cursor:grab;padding:4px 6px;font-size:16px;line-height:1;user-select:none;touch-action:none}
.ed-handle:active{cursor:grabbing}
.ed-addslot{display:flex;justify-content:center;height:0;position:relative;z-index:15}
.ed-addslot button{transform:translateY(-50%);font:600 13px/1 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;background:#fff;color:#3451d1;border:1.5px dashed #8aa2ff;border-radius:999px;padding:7px 14px;cursor:pointer;opacity:.55;transition:opacity .15s}
.ed-addslot button:hover,.ed-addslot:first-child button{opacity:1}
.ed-text{outline:1px dashed transparent;outline-offset:3px;border-radius:4px;cursor:text;min-width:2em}
.ed-text:hover{outline-color:#8aa2ff}
.ed-text:focus{outline:2px solid #4b6cff;background:color-mix(in srgb,#4b6cff 6%,transparent)}
.ed-text:empty::before{content:attr(data-ph);opacity:.45;font-weight:400}
span.ed-text,.chip.ed-text{display:inline-block}
.ed-img{cursor:pointer}
.ed-img img{-webkit-user-drag:none;user-select:none}
.ed-img-hint{position:absolute;inset:auto 10px 10px 10px;background:rgba(31,36,48,.82);color:#fff;font:600 13px/1.3 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;border-radius:8px;padding:8px 10px;text-align:center;opacity:0;transition:opacity .15s;pointer-events:none}
.ed-img:hover .ed-img-hint{opacity:1}
.ed-img.drag-over{outline:3px solid #2fb67c;outline-offset:-3px}
.ed-img.drag-over::after{content:"여기에 놓으세요";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(47,182,124,.35);color:#fff;font:800 18px 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.ed-img-del{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(31,36,48,.8);color:#fff;font-size:16px;cursor:pointer;opacity:0;transition:opacity .15s}
.ed-img:hover .ed-img-del{opacity:1}
.ed-item{position:relative}
.chips>.ed-item,.hero-btns>.ed-item,.contact-links>.ed-item{display:inline-flex}
.ed-itools{position:absolute;top:-14px;right:-6px;z-index:18;display:none;gap:2px;background:#1f2430;color:#fff;border-radius:8px;padding:3px;font:12px/1 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;white-space:nowrap}
.ed-item:hover>.ed-itools,.ed-item:focus-within>.ed-itools{display:flex}
.ed-itools button{padding:5px 6px}
.ed-add-item{display:inline-block;margin-top:12px;font:600 13px/1 'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;background:transparent;color:#3451d1;border:1.5px dashed #8aa2ff;border-radius:8px;padding:8px 12px;cursor:pointer}
.ed-add-item:hover{background:#eef1ff}

  /* ---------- 공통 도구 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid(p) { return (p || 'b') + Math.random().toString(36).slice(2, 8); }
  function getPath(o, path) {
    return path.split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o);
  }
  function setPath(o, path, v) {
    var ks = path.split('.'); var last = ks.pop();
    var t = ks.reduce(function (a, k) { return a[k]; }, o);
    t[last] = v;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  function safeUrl(u) {
    u = String(u || '').trim();
    if (/^(https?:|mailto:|tel:|#)/i.test(u)) return u;
    return '#';
  }

  /* ---------- 메뉴 도구 ---------- */
  function walk(nodes, fn, parents) {
    parents = parents || [];
    (nodes || []).forEach(function (n) {
      fn(n, parents);
      if (n.children) walk(n.children, fn, parents.concat(n));
    });
  }
  function findNodeByPage(pid) {
    var r = null;
    walk(data.menu, function (n, p) { if (!r && n.page === pid) r = { node: n, parents: p }; });
    return r;
  }
  function findNode(id) {
    var r = null;
    walk(data.menu, function (n, p) { if (n.id === id) r = { node: n, parents: p }; });
    return r;
  }
  function pageHref(pid) {
    if (!pid || pid === 'home') return '#/';
    var f = findNodeByPage(pid);
    if (!f) return '#/' + encodeURIComponent(pid);
    return '#/' + f.parents.map(function (x) { return encodeURIComponent(x.page); }).concat(encodeURIComponent(pid)).join('/');
  }
  function currentPageId() {
    var h = location.hash.replace(/^#\/?/, '');
    if (!h) return 'home';
    var seg = h.split('/').filter(Boolean);
    var id = decodeURIComponent(seg[seg.length - 1] || 'home');
    return data.pages[id] ? id : 'home';
  }
  function pageTitle(pid) {
    var f = findNodeByPage(pid);
    return f ? f.node.label : ((data.pages[pid] && data.pages[pid].title) || '');
  }
  function findBlock(id) {
    var found = null;
    Object.keys(data.pages).forEach(function (pid) {
      (data.pages[pid].blocks || []).forEach(function (b) { if (b.id === id) found = b; });
    });
    return found;
  }

  function F(b, key, tag, cls, ph, single) {
    var v = getPath(b.props, key); v = v == null ? '' : String(v);
    if (!editing) {
      if (!v) return '';
      return '<' + tag + ' class="' + cls + '">' + esc(v) + '</' + tag + '>';
    }
    return '<' + tag + ' class="' + cls + ' ed-text" data-b="' + b.id + '" data-k="' + esc(key) + '" data-ph="' + esc(ph) + '"' +
      (single ? ' data-single="1"' : '') + ' contenteditable="plaintext-only" spellcheck="false">' + esc(v) + '</' + tag + '>';
  }
  function IMG(b, key, cls, label) {
    var v = getPath(b.props, key) || '';
    var inner = v ? '<img src="' + esc(v) + '" alt=""' + (editing ? ' draggable="false"' : '') + '>' : '<div class="img-ph"><span>' + esc(label || '이미지') + '</span></div>';
    if (!editing) return '<div class="img-slot ' + cls + '">' + inner + '</div>';
    return '<div class="img-slot ' + cls + ' ed-img" data-b="' + b.id + '" data-k="' + esc(key) + '">' + inner +
      '<div class="ed-img-hint">사진을 끌어다 놓거나 클릭해서 고르세요</div>' +
      (v ? '<button type="button" class="ed-img-del" data-act="img-del" title="사진 지우기">×</button>' : '') + '</div>';
  }
  function BTN(b, k, cls, urlKey, external) {
    var it = getPath(b.props, k) || {};

    if (!editing) {
      if (!it.label) return '';
      var ext = external && /^https?:/i.test(url);
      return '<a class="btn ' + cls + '" href="' + esc(safeUrl(url)) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + esc(it.label) + '</a>';
    }
    return '<span class="btn ' + cls + '">' + F(b, k + '.label', 'span', 'btn-label', '버튼 이름', true) +
      '<button type="button" class="ed-link" data-act="link-edit" data-b="' + b.id + '" data-k="' + esc(k + '.' + urlKey) + '" title="연결 주소: ' + esc(url || '없음') + '">🔗</button></span>';
  }
  function LIST(b, key, fn, cls) {
    var arr = getPath(b.props, key) || [];

    return '<div class="print-bar"><span>인쇄 창에서 대상(프린터)을 <b>PDF로 저장</b>으로 고르세요.</span>' +

      ids.map(function (id) { return '<div class="print-page">' + renderPage(id) + '</div>'; }).join('');
  }

  function render() {

  /* ---------- 편집 상태 · 되돌리기 · 임시저장 ---------- */

  /* ---------- 메뉴 편집 패널 ---------- */
  function menuList(nodes, parent, d) {
    return '<ul class="ed-mlist">' + nodes.map(function (n, i) {
      return '<li data-sort="1" data-group="menu:' + parent + '" data-idx="' + i + '" data-nid="' + n.id + '"><div class="ed-mrow">' +
        '<span class="ed-handle" title="끌어서 순서 바꾸기">⠿</span>' +

  function renderPanel() {

      '<p class="ed-hint">⠿를 끌어서 순서를 바꾸고, 이름은 바로 고치세요. ＋로 하위 메뉴를 만들 수 있고, 최대 3단계까지입니다. 메뉴를 만들면 페이지도 함께 생깁니다.</p>' +
      menuList(data.menu, 'root', 1) +

  function menuDepth(id) { var f = findNode(id); return f ? f.parents.length + 1 : 0; }
  function addMenu(parentId) {
    var depth = parentId === 'root' ? 1 : menuDepth(parentId) + 1;
    if (depth > 3) { toast('메뉴는 3단계까지만 만들 수 있어요.'); return; }
    var pid = uid('p');
    var node = { id: uid('m'), label: '새 메뉴', page: pid };
    mutate(function () {
      data.pages[pid] = {
        title: '새 메뉴',

          ? [{ id: uid(), type: 'star', props: BLOCKS.star.def() }, { id: uid(), type: 'gallery', props: BLOCKS.gallery.def() }]

  function deleteMenu(nid) {

    var count = 0; walk([f.node], function () { count++; });
    confirmBox('「' + esc(f.node.label) + '」 메뉴' + (count > 1 ? '와 하위 메뉴 ' + (count - 1) + '개' : '') + '를 삭제할까요?<br>연결된 페이지와 내용도 함께 지워집니다. (되돌리기로 복구할 수 있어요)', '삭제', true).then(function (ok) {
      if (!ok) return;
      var cur = currentPageId();
      mutate(function () {
        var pages = []; walk([f.node], function (n) { pages.push(n.page); });
        var arr = f.parents.length ? f.parents[f.parents.length - 1].children : data.menu;

  }

  /* ---------- 사진 넣기 ---------- */
  function compressImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
        var ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var out = c.toDataURL('image/webp', 0.8);
        if (out.indexOf('data:image/webp') !== 0) {
          ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', 0.82);
        }
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }
  function putImage(file, bid, key) {
    var name = (file.name || '').toLowerCase();
    if (/\.(heic|heif)$/.test(name) || /hei[cf]/.test(file.type)) { toast('아이폰 HEIC 사진은 바로 넣을 수 없어요. JPG로 바꿔서 넣어 주세요.', 4500); return; }
    if (!/^image\//.test(file.type)) { toast('사진 파일(JPG, PNG, WebP)만 넣을 수 있어요.'); return; }
    toast('사진 크기를 줄이는 중…');
    compressImage(file).then(function (dataUrl) {
      var b = findBlock(bid); if (!b) return;
      mutate(function () { setPath(b.props, key, dataUrl); });
      toast('사진을 바꿨습니다. (' + Math.round(dataUrl.length * 0.75 / 1024) + 'KB)');
    }).catch(function () { toast('이 사진은 열 수 없어요. 다른 사진으로 해 보세요.'); });
  }
  function pickImage(slot) {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';

    input.click();
  }

  /* ---------- 목록(블록·항목·메뉴) 순서 바꾸기 ---------- */
  function groupArray(g) {
    if (g === 'blocks') return data.pages[currentPageId()].blocks;
    var parts = g.split(':');
    if (parts[0] === 'items') { var b = findBlock(parts[1]); return b ? getPath(b.props, parts[2]) : null; }
    if (parts[0] === 'menu') {
      if (parts[1] === 'root') return data.menu;
      var f = findNode(parts[1]); return f ? f.node.children : null;
    }
    return null;
  }
  function moveIn(g, from, to) {
    var arr = groupArray(g);
    if (!arr || to < 0 || to >= arr.length || from === to) return;
    mutate(function () { var x = arr.splice(from, 1)[0]; arr.splice(to, 0, x); });
  }

  var drag = null;
  function clearMarks() {
    document.querySelectorAll('.ed-drop-before,.ed-drop-after').forEach(function (x) { x.classList.remove('ed-drop-before', 'ed-drop-after', 'h'); });
  }
  function endDrag() {
    clearMarks();
    document.querySelectorAll('[data-sort][draggable]').forEach(function (x) { x.removeAttribute('draggable'); x.classList.remove('ed-dragging'); });
    drag = null;
  }
  function sortTarget(t) {
    var el = t && t.closest ? t.closest('[data-sort]') : null;
    while (el && el.getAttribute('data-group') !== drag.group) el = el.parentElement ? el.parentElement.closest('[data-sort]') : null;
    return el;
  }
  function isHorizontal(el) {
    var g = el.getAttribute('data-group');
    var sib = el.nextElementSibling;
    while (sib && sib.getAttribute('data-group') !== g) sib = sib.nextElementSibling;
    if (!sib) { sib = el.previousElementSibling; while (sib && sib.getAttribute('data-group') !== g) sib = sib.previousElementSibling; }
    return !!sib && Math.abs(sib.getBoundingClientRect().top - el.getBoundingClientRect().top) < 8;
  }
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }

  document.addEventListener('pointerdown', function (e) {
    var h = e.target.closest && e.target.closest('.ed-handle');
    if (!h) return;
    var el = h.closest('[data-sort]');
    if (el) el.setAttribute('draggable', 'true');
  });
  document.addEventListener('pointerup', function () {
    if (!drag) document.querySelectorAll('[data-sort][draggable]').forEach(function (x) { x.removeAttribute('draggable'); });
  });
  document.addEventListener('dragstart', function (e) {
    var el = e.target.closest && e.target.closest('[data-sort][draggable]');
    if (!el) return;
    e.stopPropagation();
    drag = { group: el.getAttribute('data-group'), idx: +el.getAttribute('data-idx'), el: el, target: null };
    e.dataTransfer.effectAllowed = 'move';

      var after = horiz ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      el.classList.add(after ? 'ed-drop-after' : 'ed-drop-before');
      if (horiz) el.classList.add('h');
      drag.target = { idx: +el.getAttribute('data-idx'), after: after };
      return;
    }
    if (!editing || !hasFiles(e)) return;
    e.preventDefault();
    var slot = e.target.closest && e.target.closest('.ed-img');
    document.querySelectorAll('.ed-img.drag-over').forEach(function (x) { if (x !== slot) x.classList.remove('drag-over'); });
    if (slot) { slot.classList.add('drag-over'); e.dataTransfer.dropEffect = 'copy'; }
    else e.dataTransfer.dropEffect = 'none';
  });
  document.addEventListener('dragleave', function (e) {
    var slot = e.target.closest && e.target.closest('.ed-img');
    if (slot && !slot.contains(e.relatedTarget)) slot.classList.remove('drag-over');
  });
  document.addEventListener('drop', function (e) {
    if (drag) {
      e.preventDefault();
      var t = drag.target, g = drag.group, from = drag.idx;
      endDrag();
      if (!t) return;
      var to = t.idx + (t.after ? 1 : 0);
      if (from < to) to--;
      moveIn(g, from, to);
      return;
    }
    if (!hasFiles(e)) return;
    e.preventDefault();
    document.querySelectorAll('.ed-img.drag-over').forEach(function (x) { x.classList.remove('drag-over'); });
    if (!editing) return;
    var slot = e.target.closest && e.target.closest('.ed-img');
    if (!slot) { toast('사진은 이미지 자리 위에 놓아 주세요.'); return; }
    var file = e.dataTransfer.files[0];
    if (file) putImage(file, slot.dataset.b, slot.dataset.k);
  });
  document.addEventListener('dragend', endDrag);

  /* ---------- 글자 편집 ---------- */
  var textSnap = null, textStart = null;
  function readText(el) {
    var t = (el.innerText || '').replace(/ /g, ' ').replace(/\r/g, '');
    if (el.hasAttribute('data-single')) t = t.replace(/\n+/g, ' ').trim();
    else t = t.replace(/\n$/, '');
    if (!t.trim()) t = '';
    return t;
  }
  app.addEventListener('focusin', function (e) {
    var el = e.target.closest && e.target.closest('.ed-text');
    if (!el) return;
    textSnap = JSON.stringify(data);
    textStart = readText(el);
  });
  app.addEventListener('input', function (e) {
    var el = e.target.closest && e.target.closest('.ed-text');
    if (!el) return;
    var b = findBlock(el.dataset.b); if (!b) return;
    var v = readText(el);
    setPath(b.props, el.dataset.k, v);
    if (!v && el.innerHTML !== '') el.innerHTML = '';
    changed(true);
  });
  app.addEventListener('focusout', function (e) {
    var el = e.target.closest && e.target.closest('.ed-text');
    if (!el || textSnap === null) return;
    if (readText(el) !== textStart) pushUndo(textSnap);
    textSnap = null;
  });
  app.addEventListener('keydown', function (e) {
    var el = e.target.closest && e.target.closest('.ed-text');
    if (el && e.key === 'Enter' && el.hasAttribute('data-single')) { e.preventDefault(); el.blur(); }
  });
  app.addEventListener('paste', function (e) {
    var el = e.target.closest && e.target.closest('.ed-text');
    if (!el) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    if (el.hasAttribute('data-single')) text = text.replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, text);
  });

  /* ---------- 메뉴 이름 입력 ---------- */
  var menuSnap = null;
  document.addEventListener('focusin', function (e) {
    if (e.target.classList && e.target.classList.contains('ed-minput')) menuSnap = JSON.stringify(data);
  });
  document.addEventListener('input', function (e) {
    if (!e.target.classList || !e.target.classList.contains('ed-minput')) return;
    var f = findNode(e.target.dataset.nid); if (!f) return;
    var v = e.target.value;
    if (data.pages[f.node.page] && data.pages[f.node.page].title === f.node.label) data.pages[f.node.page].title = v;
    f.node.label = v;
    state.dirty = true;
    clearTimeout(draftTimer); draftTimer = setTimeout(saveDraft, 600);
    updateStatus();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('ed-minput')) {
      if (!t.value.trim()) { var f = findNode(t.dataset.nid); if (f) f.node.label = '이름 없음'; }
      if (menuSnap) pushUndo(menuSnap);
      menuSnap = null;
      t.blur();
      changed();
      return;
    }
    var act = t.getAttribute && t.getAttribute('data-change');
    if (act === 'card-page') {
      var b = findBlock(t.dataset.b); if (!b) return;
      mutate(function () { setPath(b.props, t.dataset.k, t.value); });
    } else if (act === 'toggle-pdf') {
      var bid = t.closest('.ed-block').dataset.bid, blk = findBlock(bid);
      mutate(function () { blk.props.showPdf = t.checked; });
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target.classList && e.target.classList.contains('ed-minput') && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  });

  /* ---------- 저장 ---------- */
  function setMeta(doc, attr, name, value) {
    var el = doc.querySelector('meta[' + attr + '="' + name + '"]');
    if (!el) { el = doc.createElement('meta'); el.setAttribute(attr, name); doc.head.appendChild(el); }
    el.setAttribute('content', value || '');
  }
  function buildHtml() {
    var doc = new DOMParser().parseFromString(TEMPLATE, 'text/html');
    doc.getElementById('site-data').textContent = '\n' + JSON.stringify(data, null, 2).replace(/</g, '\\u003c') + '\n';
    doc.title = data.site.title || '포트폴리오';
    setMeta(doc, 'name', 'description', data.site.description);
    setMeta(doc, 'property', 'og:title', data.site.title);
    setMeta(doc, 'property', 'og:description', data.site.description);
    var a = doc.getElementById('app'); if (a) a.innerHTML = '';
    doc.documentElement.removeAttribute('data-theme');
    return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  }
  function saveFile() {
    var active = document.activeElement;
    if (active && active.blur) active.blur();
    var html = buildHtml();
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    state.dirty = false;
    saveDraft();
    updateStatus();
    var mb = blob.size / 1048576;
    var size = mb >= 1 ? mb.toFixed(1) + 'MB' : Math.round(blob.size / 1024) + 'KB';
    var m = modal('<h3>index.html 파일을 받았습니다 (' + size + ')</h3>' +
      (mb > 8 ? '<p class="ed-warn">파일이 8MB를 넘었습니다. 사진 수를 줄이면 더 빨리 열립니다.</p>' : '') +
      '<p class="ed-msg">이제 깃허브에 올리면 내 사이트에 반영됩니다.</p><ol>' +
      '<li>내 깃허브 저장소에서 <b>Add file → Upload files</b>를 누릅니다.</li>' +
      '<li>방금 받은 <b>index.html</b>을 끌어다 놓습니다.<br><small>파일 이름이 index (1).html처럼 바뀌었다면 index.html로 고친 뒤 올리세요.</small></li>' +
      '<li><b>Commit changes</b>를 누르고 1~2분 뒤 내 주소에서 새로고침(Ctrl+Shift+R)합니다.</li></ol>' +
      '<div class="ed-actions"><button type="button" class="ed-primary" data-x="no">확인</button></div>');
    m.querySelector('[data-x=no]').onclick = closeModal;
  }

  /* ---------- 편집 모드 들어가기 · 나가기 ---------- */
  function enterEdit() {
    state.edit = true;
    ssSet('pf-edit', '1');
    var raw = lsGet(DRAFT_KEY), draft = null;
    try { draft = raw ? JSON.parse(raw) : null; } catch (e) { draft = null; }
    render();
    if (draft && draft.d && draft.d.pages && JSON.stringify(draft.d) !== EMBEDDED) {
      var when = new Date(draft.t || Date.now());
      var label = (when.getMonth() + 1) + '월 ' + when.getDate() + '일 ' + when.getHours() + ':' + ('0' + when.getMinutes()).slice(-2);
      var m = modal('<h3>이어서 편집할까요?</h3><p class="ed-msg">이 브라우저에 ' + label + '에 임시저장된 편집 내용이 있습니다.<br>배포된 내용과 다릅니다.</p>' +
        '<p class="ed-hint">방금 깃허브에 올렸는데 반영이 늦는 중이라면 [이어서 편집]을 고르세요.</p>' +
        '<div class="ed-actions"><button type="button" data-x="no">배포된 내용으로 시작</button><button type="button" class="ed-primary" data-x="yes">이어서 편집</button></div>');
      m.querySelector('[data-x=no]').onclick = function () { closeModal(); lsDel(DRAFT_KEY); };
      m.querySelector('[data-x=yes]').onclick = function () { closeModal(); data = draft.d; state.dirty = true; rerender(); };
    } else {
      toast('편집 모드입니다. 글자를 클릭해 고치고, 사진은 끌어다 놓으세요.', 3500);
    }
  }
  function exitEdit() {
    var go = function () {
      state.edit = false; state.preview = false; state.mobile = false; state.panel = false;
      ssDel('pf-edit');
      closeModal();
      render();
      if (state.dirty) toast('지금 화면은 내 브라우저에만 보이는 상태입니다. 배포하려면 [저장] 후 깃허브에 올리세요.', 5000);
    };
    if (!state.dirty) return go();
    confirmBox('저장하지 않은 변경이 있습니다.<br>편집 내용은 이 브라우저에 임시저장되어 있어서, 다시 편집 모드로 들어오면 이어서 할 수 있어요.<br>편집을 끝낼까요?', '편집 끝내기').then(function (ok) { if (ok) go(); });
  }
  function enterPrint() {
    state.print = true;
    state.navOpen = false;
    render();
    window.scrollTo(0, 0);
    setTimeout(function () { window.print(); }, 400);
  }

  /* ---------- 클릭 처리 ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var actEl = t.closest && t.closest('[data-act]');
    var act = actEl ? actEl.getAttribute('data-act') : null;

    if (!act) {
      if (editing) {
        var slot = t.closest && t.closest('.ed-img');
        if (slot) { e.preventDefault(); pickImage(slot); return; }
        var link = t.closest && t.closest('#app a[href]');
        if (link && link.closest('.ed-block')) { e.preventDefault(); return; }
      } else if (!state.edit || state.preview) {
        var gimg = t.closest && t.closest('.gallery .img-slot img');
        if (gimg) {
          var lb = document.createElement('div'); lb.className = 'lightbox';
          lb.innerHTML = '<img src="' + esc(gimg.getAttribute('src')) + '" alt="">';
          lb.onclick = function () { lb.remove(); };
          document.body.appendChild(lb);
        }
      }
      return;
    }

    switch (act) {
      case 'nav-toggle': state.navOpen = !state.navOpen; var nav = app.querySelector('.nav'); if (nav) nav.classList.toggle('open', state.navOpen); return;
      case 'sub-toggle': actEl.closest('.nav-li').classList.toggle('open'); return;
      case 'pdf': enterPrint(); return;
      case 'do-print': window.print(); return;
      case 'exit-print': state.print = false; render(); return;
    }
    if (!state.edit) return;

    var blockEl = actEl.closest('.ed-block');
    var bid = blockEl ? blockEl.getAttribute('data-bid') : null;
    var bidx = blockEl ? +blockEl.getAttribute('data-idx') : -1;
    var blocks = data.pages[currentPageId()].blocks;
    var item = actEl.closest('.ed-item');

    switch (act) {
      case 'save': saveFile(); break;
      case 'exit-edit': exitEdit(); break;
      case 'undo': undo(); break;
      case 'preview': state.preview = !state.preview; if (!state.preview) state.mobile = state.mobile; render(); break;
      case 'mobile': state.mobile = !state.mobile; render(); break;
      case 'panel': state.panel = !state.panel; render(); break;
      case 'theme': themeModal(); break;
      case 'settings': settingsModal(); break;
      case 'blk-add': blockPalette(+actEl.getAttribute('data-at')); break;
      case 'blk-up': moveIn('blocks', bidx, bidx - 1); break;
      case 'blk-down': moveIn('blocks', bidx, bidx + 1); break;
      case 'blk-dup': mutate(function () { var c = clone(blocks[bidx]); c.id = uid(); blocks.splice(bidx + 1, 0, c); }); toast('블록을 복제했습니다.'); break;
      case 'blk-del':
        confirmBox('이 블록(' + esc(BLOCKS[blocks[bidx].type] ? BLOCKS[blocks[bidx].type].name : '') + ')을 삭제할까요?<br>되돌리기로 복구할 수 있어요.', '삭제', true).then(function (ok) {
          if (ok) mutate(function () { blocks.splice(bidx, 1); });
        });
        break;
      case 'flip': mutate(function () { var b = findBlock(bid); b.props.flip = !b.props.flip; }); break;
      case 'img-del': (function () {
        var s = actEl.closest('.ed-img'); var b = findBlock(s.dataset.b);
        mutate(function () { setPath(b.props, s.dataset.k, ''); });
      })(); break;
      case 'link-edit': linkModal(actEl.dataset.b, actEl.dataset.k); break;
      case 'item-add': (function () {
        var b = findBlock(actEl.dataset.b), lk = actEl.dataset.lk;
        var arr = getPath(b.props, lk) || [];
        var max = ITEM_MAX[lk] || ITEM_MAX[b.type] || 12;
        if (arr.length >= max) { toast('이 목록은 ' + max + '개까지 넣을 수 있어요.'); return; }
        var def = ITEM_DEF[lk] || ITEM_DEF_BY_TYPE[b.type];
        mutate(function () { if (!getPath(b.props, lk)) setPath(b.props, lk, []); getPath(b.props, lk).push(clone(def)); });
      })(); break;
      case 'item-up': case 'item-down': case 'item-dup': case 'item-del': (function () {
        if (!item) return;
        var g = item.getAttribute('data-group'), i = +item.getAttribute('data-idx');
        if (act === 'item-up') return moveIn(g, i, i - 1);
        if (act === 'item-down') return moveIn(g, i, i + 1);
        var arr = groupArray(g);
        if (act === 'item-dup') {
          var b = findBlock(item.dataset.b), max = ITEM_MAX[item.dataset.lk] || ITEM_MAX[b.type] || 12;
          if (arr.length >= max) { toast('이 목록은 ' + max + '개까지 넣을 수 있어요.'); return; }
          mutate(function () { arr.splice(i + 1, 0, clone(arr[i])); });
        } else {
          mutate(function () { arr.splice(i, 1); });
          toast('삭제했습니다. 되돌리기로 복구할 수 있어요.');
        }
      })(); break;
      case 'menu-add': addMenu(actEl.getAttribute('data-parent')); break;
      case 'menu-del': deleteMenu(actEl.closest('[data-nid]').getAttribute('data-nid')); break;
      case 'menu-go': (function () { var f = findNode(actEl.closest('[data-nid]').getAttribute('data-nid')); if (f) location.hash = pageHref(f.node.page); })(); break;
    }
  });

  /* ---------- 키보드 · 창 이벤트 ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); var lb = document.querySelector('.lightbox'); if (lb) lb.remove(); }
    if (!editing) return;
    var inText = e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !inText) { e.preventDefault(); undo(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (state.edit && state.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', function () {
    if (/^#edit/.test(location.hash)) {
      history.replaceState(null, '', location.pathname + location.search + '#/');
      if (!state.edit) enterEdit(); else render();
      return;
    }
    state.navOpen = false;
    render();
    window.scrollTo(0, 0);
  });
  window.addEventListener('afterprint', function () { if (state.print) { state.print = false; render(); } });
  if (window.ResizeObserver) new ResizeObserver(updateNarrow).observe(app);
  else window.addEventListener('resize', updateNarrow);

  /* ---------- 시작 ---------- */
  var startEdit = false;
  if (/^#edit/.test(location.hash) || /[?&]edit\b/.test(location.search)) {
    history.replaceState(null, '', location.pathname + '#/');
    startEdit = true;
  } else if (ssGet('pf-edit') === '1') {
    startEdit = true;
  }
  if (startEdit) enterEdit(); else render();
})();
</script>
</body>
</html>
